name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: |
          npm run build --if-present
          if [ ! -d "dist" ] && [ ! -d "build" ] && [ ! -d "www" ]; then
            mkdir -p dist
            echo '<!DOCTYPE html><html><head><title>CIT App</title></head><body><h1>CIT Application</h1></body></html>' > dist/index.html
          fi

      - name: Prepare Capacitor iOS Platform
        run: |
          WEB_DIR="dist"
          if [ -d "build" ]; then WEB_DIR="build"; fi
          if [ -d "www" ]; then WEB_DIR="www"; fi

          rm -rf ios
          npx cap init CIT-App com.cit.application --web-dir $WEB_DIR || true
          npx cap add ios
          npx cap sync ios

      - name: Build Xcode Project
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO -derivedDataPath buildDerivedData build
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO -derivedDataPath buildDerivedData build
          fi

      - name: Package Valid IPA Structure
        run: |
          mkdir -p ipa_build/Payload
          APP_PATH=$(find ios/App/buildDerivedData -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found!"
            exit 1
          fi
          cp -R "$APP_PATH" ipa_build/Payload/
          cd ipa_build
          zip -r CIT-App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CIT-App-iOS
          path: ipa_build/CIT-App.ipa
