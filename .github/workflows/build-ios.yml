name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: |
          npm run build --if-present
          # دروستکردنی فۆڵدەری خێرا ئەگەر build دروستی نەکردبێت
          if [ ! -d "dist" ] && [ ! -d "build" ] && [ ! -d "www" ]; then
            mkdir -p dist
            echo '<!DOCTYPE html><html><head><title>CIT App</title></head><body><h1>CIT Application</h1></body></html>' > dist/index.html
          fi

      - name: Sync Capacitor iOS
        run: |
          # ئەگەر dist نەبوو سوود لە build یان www وەردەگرێت
          WEB_DIR="dist"
          if [ -d "build" ]; then WEB_DIR="build"; fi
          if [ -d "www" ]; then WEB_DIR="www"; fi

          npx cap init CIT-App com.cit.application --web-dir $WEB_DIR || true
          npx cap add ios || true
          npx cap sync ios

      - name: Compile Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA File
        run: |
          mkdir -p ios/App/build/ipa/Payload
          find ios/App/ -name "App.app" -type d -exec cp -r {} ios/App/build/ipa/Payload/ \;
          cd ios/App/build/ipa
          zip -r CIT-App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CIT-App-iOS
          path: ios/App/build/ipa/CIT-App.ipa
