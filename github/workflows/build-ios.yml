name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Install Capacitor Core & CLI
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios --save
          npx cap init CIT-App com.cit.application --web-dir dist || true

      - name: Build Web Assets
        run: npm run build --if-present

      - name: Add and Sync iOS Platform
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Compile Xcode Scheme
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p ios/App/build/ipa/Payload
          cp -r ios/App/build/Release-iphoneos/App.app ios/App/build/ipa/Payload/ || cp -r ios/App/DerivedData/App/Build/Products/Release-iphoneos/App.app ios/App/build/ipa/Payload/
          cd ios/App/build/ipa
          zip -r CIT-App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CIT-App-iOS
          path: ios/App/build/ipa/CIT-App.ipa
