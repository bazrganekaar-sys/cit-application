name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install

    - name: Sync Capacitor iOS
      run: |
        npx cap add ios || true
        npx cap sync ios

    - name: Build iOS App
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -derivedDataPath build -sdk iphoneos CODE_SIGNING_ALLOWED=NO

    - name: Create Unsigned IPA
      run: |
        mkdir -p Payload
        cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
        zip -r App-Unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: iOS-App-IPA
        path: App-Unsigned.ipa